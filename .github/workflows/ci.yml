name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Guard - no legacy JavaFX sources
        shell: pwsh
        run: |
          # WebLogin.kt (JavaFX WebView) was replaced by JCEF; if it is still tracked,
          # the build fails with dozens of "Unresolved reference javafx" errors.
          $stale = @(
            "desktop/src/main/kotlin/com/yunx/desktop/ui/WebLogin.kt",
            "desktop/src/main/kotlin/com/yunx/desktop/JcefProbe.kt",
            "desktop/src/main/kotlin/com/yunx/desktop/JcefDiag.kt"
          ) | Where-Object { Test-Path $_ }
          if ($stale) {
            $list = ($stale -join ", ")
            throw "Stale files still tracked: $list. Remove them (git rm <file>) and push again."
          }

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile
        run: .\gradlew.bat :desktop:compileKotlin --console=plain

      - name: Unit tests
        run: .\gradlew.bat :core:test --console=plain

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: core/build/reports/tests/test
          if-no-files-found: ignore
