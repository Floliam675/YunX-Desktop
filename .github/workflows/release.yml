name: Release (portable build, optional code signing)

# 触发：推送 v* 标签，或手动运行。
#   git tag v0.4.8 && git push origin v0.4.8
#
# 产物：YunX-Desktop-<version>-win64-installer.exe（安装版，Inno Setup + LZMA2）
#       YunX-Desktop-<version>-win64-portable.exe（免安装便携包：7z 自解压 + LZMA2，含 Start-YunX.bat）
#       （未签名；若启用签名则为已签名版）
#       SHA256.txt
#
# 可选代码签名（SignPath，开源可免费申请：https://signpath.org/）：
#   在仓库 Settings → Secrets and variables → Actions 里配置
#     变量(Variables)：   SIGNPATH_ENABLED=true
#                         SIGNPATH_ORG_ID / SIGNPATH_PROJECT_SLUG /
#                         SIGNPATH_POLICY_SLUG / SIGNPATH_ARTIFACT_CONFIG_SLUG
#     密钥(Secrets)：     SIGNPATH_API_TOKEN
#   未配置时签名任务自动跳过，仍会产出未签名包。

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（例如 0.4.8）'
        required: false
        default: '0.4.8'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      zip_name: ${{ steps.version.outputs.zip_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Guard - no legacy JavaFX sources
        shell: pwsh
        run: |
          # WebLogin.kt (JavaFX WebView) was replaced by JCEF; if it is still tracked,
          # the build fails with dozens of "Unresolved reference javafx" errors.
          $stale = @(
            "desktop/src/main/kotlin/com/yunx/desktop/ui/WebLogin.kt",
            "desktop/src/main/kotlin/com/yunx/desktop/JcefProbe.kt",
            "desktop/src/main/kotlin/com/yunx/desktop/JcefLoginProbe.kt",
            "desktop/src/main/kotlin/com/yunx/desktop/ui/JcefWebLogin.kt",
            "desktop/src/main/kotlin/com/yunx/desktop/JcefDiag.kt"
          ) | Where-Object { Test-Path $_ }
          if ($stale) {
            $list = ($stale -join ", ")
            throw "Stale files still tracked: $list. Remove them (git rm <file>) and push again."
          }

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $ref = "${{ github.ref_name }}"
          $ver = if ("$ref".StartsWith("v")) { "$ref".Substring(1) } else { "${{ github.event.inputs.version }}" }
          if ([string]::IsNullOrWhiteSpace($ver)) { $ver = "0.4.8" }
          "version=$ver"            >> $env:GITHUB_OUTPUT
          "zip_name=YunX-Desktop-$ver-win64-portable.exe" >> $env:GITHUB_OUTPUT
                    Write-Host "version=$ver"

      - name: Guard - version matches build.gradle.kts
        shell: pwsh
        run: |
          # jpackage 不校验 app-image 版本（实测），所以 tag 与 packageVersion 不一致时
          # 会打出"安装器写着 vX、程序关于页写着 vY"的错版包。这里直接拦下。
          $declared = ([regex]::Match((Get-Content "desktop/build.gradle.kts" -Raw), 'packageVersion\s*=\s*"([^"]+)"')).Groups[1].Value
          $tagged = "${{ steps.version.outputs.version }}"
          if ($declared -ne $tagged) {
            throw "Version mismatch: desktop/build.gradle.kts has packageVersion='$declared' but this run resolves '$tagged'. Bump packageVersion first."
          }
          Write-Host "version ok: $declared"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build app image (portable, no installer)
        run: .\gradlew.bat :desktop:createDistributable --console=plain

      - name: Install packaging tools (Inno Setup + 7-Zip)
        shell: pwsh
        run: |
          # 交付物改用 LZMA2 solid 压缩：同样内容比 jpackage 的 WiX/MSI(mszip) 小约 20%
          choco install innosetup 7zip --no-progress -y
          $iscc = "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          Write-Host "ISCC: $iscc"
          & "$env:ProgramFiles\7-Zip\7z.exe" | Select-Object -First 2

      - name: Package (portable 7z SFX + Inno Setup installer)
        shell: pwsh
        run: |
          # 文档注入、厂商签名 launcher、便携版自解压、安装版编译、校验和都由这个脚本完成，
          # 本地打包走同一脚本，避免两边行为漂移。
          .\packaging\build-package.ps1 `
            -Version "${{ steps.version.outputs.version }}" `
            -AppImage "desktop/build/compose/binaries/main/app/YunX Desktop" `
            -OutDir "dist" `
            -SignJdk "$env:JAVA_HOME"
          Get-ChildItem dist | Select-Object Name, Length

      - name: Checksums
        shell: pwsh
        run: |
          $lines = foreach ($f in Get-ChildItem dist -File | Where-Object { $_.Extension -in '.zip', '.exe' } | Sort-Object Name) {
            $h = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($f.Name)"
          }
          $lines | Set-Content dist/SHA256.txt -Encoding ascii
          Get-Content dist/SHA256.txt

      - name: Upload unsigned artifacts
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows
          path: dist/*
          if-no-files-found: error

  sign:
    needs: build
    # 只在你配置了 SIGNPATH_ENABLED=true 时运行；否则整个签名任务跳过
    if: ${{ vars.SIGNPATH_ENABLED == 'true' }}
    runs-on: windows-latest
    steps:
      - name: Submit signing request to SignPath
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORG_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIG_SLUG }}
          github-artifact-name: unsigned-windows
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Upload signed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: signed-windows
          path: signed/*
          if-no-files-found: error

  publish:
    needs: [ build, sign ]
    if: ${{ always() && needs.build.result == 'success' && (needs.sign.result == 'success' || needs.sign.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Download signed artifacts (preferred)
        id: dl_signed
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: signed-windows
          path: dist

      - name: Download unsigned artifacts (fallback)
        if: ${{ steps.dl_signed.outcome != 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: unsigned-windows
          path: dist

      - name: Show files
        run: ls -lh dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', needs.build.outputs.version) }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', needs.build.outputs.version) }}
          draft: true
          generate_release_notes: true
          body: |
            未签名的 Windows 安装包 / 便携包。若系统提示被拦截：
            - SmartScreen：点「更多信息 → 仍要运行」。
            - 智能应用控制（Smart App Control，无“仍要运行”）：双击包内的 Start-YunX.bat，
              它用包内已签名的 Java launcher 启动，无需安装任何东西（也无需关闭该功能）。
            请用 SHA256.txt 校验文件完整性。详见 README「常见问题」。
          files: |
            dist/**
